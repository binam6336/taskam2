plugins { id 'com.android.application' }

// امضای نسخه‌ی release: android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword) — در گیت نیست.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }

android {
    namespace 'com.taskam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.taskam.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        // آدرس ثابت سرور؛ کاربر آن را نمی‌بیند و عوض نمی‌کند. برای سرور دیگر: ./gradlew assembleRelease -PserverUrl=https://example.com
        def serverUrl = (project.findProperty('serverUrl') ?: 'https://mahyarsalehee.ir/taskam').toString().trim()
        if (!(serverUrl ==~ /(?i)^https?:\/\/[^\s"]+$/)) throw new GradleException('serverUrl نامعتبر است: ' + serverUrl)
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
            // همه‌ی طرح‌های امضا برای سازگاری با نصب‌کننده‌های مختلف (اندروید ۷ تا ۱۵)
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
