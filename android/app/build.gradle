plugins { id 'com.android.application' }

// امضای نسخه‌ی release: android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword) — در گیت نیست.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }

android {
    namespace 'com.taskam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.taskam.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        // آدرس سرور پیش‌فرض (صفحه‌ی اول نمایش داده نمی‌شود)؛ با -PserverUrl=... عوض می‌شود و -PserverUrl= (خالی) یعنی در اولین اجرا پرسیده شود
        buildConfigField 'String', 'SERVER_URL', '"' + (project.findProperty('serverUrl') ?: 'https://mahyarsalehee.ir/taskam') + '"'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
            // همه‌ی طرح‌های امضا برای سازگاری با نصب‌کننده‌های مختلف (اندروید ۷ تا ۱۵)
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
